<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<title>Anpfiff &amp; Bilanz</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#eef2f0; --karte:#ffffff; --text:#17221d; --leise:#5d6b64; --linie:#d9e1dc; --gruen:#1f7a4d; --gruen2:#e3f3ea; --rasen:#2d8a57;
  --rot:#c0392b; --rot2:#fbe9e7; --gelb:#b7791f; --gelb2:#fdf3dc; --blau:#2563a8; --blau2:#e6eef8; --kopf:#13362a; --kopftext:#f4faf6;
  --schatten:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05); --rad:12px;
  --unten:max(26px, calc(env(safe-area-inset-bottom, 0px) + 12px));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1714; --karte:#18231e; --text:#e6efe9; --leise:#97a69e; --linie:#2a3831; --gruen:#4cc286; --gruen2:#183a29; --rasen:#2f7d52;
  --rot:#ef6b5b; --rot2:#3a1d1a; --gelb:#e2b04a; --gelb2:#3a2f17; --blau:#6aa6ea; --blau2:#172a40; --kopf:#0a1f17; --kopftext:#e6efe9; --schatten:none; } }
:root[data-theme="dark"]{ --bg:#0f1714; --karte:#18231e; --text:#e6efe9; --leise:#97a69e; --linie:#2a3831; --gruen:#4cc286; --gruen2:#183a29; --rasen:#2f7d52;
  --rot:#ef6b5b; --rot2:#3a1d1a; --gelb:#e2b04a; --gelb2:#3a2f17; --blau:#6aa6ea; --blau2:#172a40; --kopf:#0a1f17; --kopftext:#e6efe9; --schatten:none; }
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;min-height:100dvh}
button,select,input{font:inherit;color:inherit}
.app{display:flex;min-height:100vh;min-height:100dvh}
/* Kopf */
.kopf{position:sticky;top:0;z-index:20;background:var(--kopf);color:var(--kopftext);padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;display:flex;align-items:center;gap:12px}
.kopf .verein{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kopf .info{font-size:12.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kopf .links{flex:1;min-width:0}
.kopf .kasse{font-variant-numeric:tabular-nums;font-size:13px;text-align:right;white-space:nowrap}
.weiter{background:#f2c94c;color:#1b1b1b;border:0;border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 1px 0 rgba(0,0,0,.2)}
.weiter:active{transform:translateY(1px)}
/* Navigation */
.seite{position:fixed;left:0;top:0;bottom:0;width:210px;background:var(--kopf);color:var(--kopftext);padding:18px 10px;display:flex;flex-direction:column;gap:4px;z-index:30}
.seite .marke{font-weight:800;font-size:17px;padding:4px 10px 14px;letter-spacing:.2px}
.seite .marke small{display:block;font-weight:500;font-size:11.5px;opacity:.65}
.nav-k{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:0;background:none;color:inherit;text-align:left;cursor:pointer;font-size:15px;width:100%}
.nav-k:hover{background:rgba(255,255,255,.07)}
.nav-k.aktiv{background:rgba(255,255,255,.14);font-weight:600}
.nav-k .ic{width:22px;text-align:center;font-size:17px}
.nav-k .pk{margin-left:auto;background:#f2c94c;color:#222;border-radius:999px;font-size:11px;padding:0 6px;font-weight:700}
.seite .fuss{margin-top:auto;font-size:11px;opacity:.55;padding:0 10px}
.haupt{flex:1;min-width:0;margin-left:210px;display:flex;flex-direction:column}
.inhalt{padding:16px;max-width:1100px;width:100%;margin:0 auto 40px}
.unten{display:none}
@media (max-width: 820px){
  .seite{display:none}
  .haupt{margin-left:0}
  .inhalt{padding:12px 12px calc(84px + var(--unten))}
  .unten{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--karte);border-top:1px solid var(--linie);padding:6px 4px var(--unten);justify-content:space-around}
  .unten .nav-k{flex-direction:column;gap:2px;padding:6px 2px;font-size:10.5px;align-items:center;color:var(--leise);text-align:center;border-radius:8px}
  .unten .nav-k.aktiv{background:none;color:var(--gruen)}
  .unten .nav-k .ic{font-size:19px;width:auto}
  .unten .nav-k .pk{position:absolute;margin:0 0 0 22px;font-size:10px}
  .unten .nav-k{position:relative}
  .kopf .kasse{display:none}
}
/* Bausteine */
h1{font-size:21px;margin:4px 0 12px}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:14px;margin:14px 0 6px;color:var(--leise);text-transform:uppercase;letter-spacing:.4px}
.karte{background:var(--karte);border:1px solid var(--linie);border-radius:var(--rad);padding:14px;box-shadow:var(--schatten);margin-bottom:12px}
.raster{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.raster>.karte{margin-bottom:0}
.zeile{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.zwischen{display:flex;justify-content:space-between;align-items:center;gap:8px}
.leise{color:var(--leise)}
.klein{font-size:12.5px}
.zahl{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.gross{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.plus{color:var(--gruen)} .minus{color:var(--rot)}
.knopf{border:1px solid var(--linie);background:var(--karte);border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:500}
.knopf:hover{border-color:var(--leise)}
.knopf.p{background:var(--gruen);border-color:var(--gruen);color:#fff}
.knopf.r{color:var(--rot);border-color:var(--rot)}
.knopf.k{padding:4px 9px;font-size:13px}
.knopf:disabled{opacity:.45;cursor:default}
.reiter{display:flex;gap:4px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none;border-bottom:1px solid var(--linie)}
.reiter button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--leise);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.reiter button.aktiv{color:var(--text);border-bottom-color:var(--gruen)}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 6px;border-bottom:1px solid var(--linie);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--leise);font-weight:600;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
tr.klick{cursor:pointer} tr.klick:hover td{background:var(--gruen2)}
tr.ich td{background:var(--gelb2);font-weight:600}
.tabwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pos{display:inline-block;min-width:28px;text-align:center;border-radius:6px;font-size:11.5px;font-weight:700;padding:1px 4px;color:#fff}
.pos.TW{background:#b7791f}.pos.AB{background:#2563a8}.pos.MF{background:#2d8a57}.pos.ST{background:#c0392b}
.st{display:inline-block;min-width:30px;text-align:center;border-radius:6px;font-weight:700;font-variant-numeric:tabular-nums;padding:1px 4px;background:var(--gruen2)}
.marke-ok{color:var(--gruen)} .marke-warn{color:var(--gelb)} .marke-rot{color:var(--rot)}
.zone-auf td:first-child{box-shadow:inset 4px 0 0 var(--gruen)} .zone-relauf td:first-child{box-shadow:inset 4px 0 0 #8bc9a5}
.zone-relab td:first-child{box-shadow:inset 4px 0 0 var(--gelb)} .zone-ab td:first-child{box-shadow:inset 4px 0 0 var(--rot)}
.form span{display:inline-block;width:16px;height:16px;border-radius:4px;font-size:10px;line-height:16px;text-align:center;color:#fff;margin-right:2px;font-weight:700}
.form .S{background:var(--gruen)}.form .U{background:#8a948f}.form .N{background:var(--rot)}
.balken{height:8px;border-radius:99px;background:var(--linie);overflow:hidden}
.balken>i{display:block;height:100%;background:var(--gruen)}
.post{border-left:4px solid var(--blau);padding:10px 12px;margin-bottom:8px;background:var(--karte);border-radius:0 10px 10px 0;border:1px solid var(--linie);border-left-width:4px}
.post.warn{border-left-color:var(--rot)} .post.frage{border-left-color:var(--gelb)}
.post .t{font-weight:600}
.post.neu .t::after{content:" • neu";color:var(--gelb);font-size:12px}
.post.alt{opacity:.62}
input[type=text],input[type=number],select{border:1px solid var(--linie);background:var(--karte);border-radius:8px;padding:7px 9px;min-width:0}
input[type=range]{width:100%}
label.feld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--leise)}
label.feld>*{color:var(--text)}
.filter{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.filter>label.feld{min-width:0}.filter select{min-width:0;max-width:100%}
/* Spiel */
.anzeige{background:var(--kopf);color:#fff;border-radius:var(--rad);padding:14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:12px}
.anzeige .tn{font-weight:700;font-size:16px}
.anzeige .tn:last-child{text-align:right}
.anzeige .stand{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;line-height:1}
.anzeige .min{font-size:13px;text-align:center;opacity:.8;margin-top:4px}
.ticker{max-height:420px;overflow-y:auto}
.ev{display:flex;gap:10px;padding:7px 2px;border-bottom:1px solid var(--linie);font-size:14px}
.ev .m{width:42px;flex:none;color:var(--leise);font-variant-numeric:tabular-nums;text-align:right}
.ev.tor{font-weight:700;background:var(--gruen2)} .ev.rot .x{color:var(--rot);font-weight:600} .ev.gelb .x::before{content:"▮ ";color:#e0b000}
.ev.pause,.ev.abpfiff,.ev.anpfiff{font-weight:600;color:var(--blau)}
.ev.elf{font-weight:600;background:var(--gruen2)} .ev.chance .x{color:var(--leise,#777)}
tr.pokal td{background:rgba(224,176,0,.08)}
.statz{display:grid;grid-template-columns:44px 1fr 44px;gap:6px;align-items:center;font-size:13px;margin:4px 0}
.statz .b2{display:flex;height:7px;border-radius:99px;overflow:hidden;background:var(--linie)}
.statz .b2 i:first-child{background:var(--gruen)} .statz .b2 i:last-child{background:var(--blau)}
.spielfeld{position:relative;aspect-ratio:68/82;max-width:460px;margin:10px auto 6px;border-radius:var(--rad);overflow:hidden;background:repeating-linear-gradient(180deg,#2e8b57 0 10%,#287d4e 10% 20%);color:#fff;border:2px solid rgba(255,255,255,.55)}
.spielfeld .linie{position:absolute;border:2px solid rgba(255,255,255,.45);pointer-events:none}
.spielfeld .mitte{left:0;right:0;top:-2px;height:0;border-width:2px 0 0}
.spielfeld .kreis{left:50%;top:0;width:28%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%}
.spielfeld .strafraum{left:20%;right:20%;bottom:-2px;height:17%}
.spielfeld .fuenfer{left:36%;right:36%;bottom:-2px;height:6.5%}
.spl{position:absolute;transform:translate(-50%,-50%);width:22%;max-width:96px;background:rgba(0,0,0,.38);color:#fff;border:2px solid transparent;border-radius:10px;padding:3px 2px 4px;text-align:center;font:inherit;cursor:pointer;line-height:1.15}
.spl b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spl i{display:block;font-style:normal;font-size:10.5px;opacity:.85}
.spl .sz{display:inline-block;font-size:10px;font-weight:700;background:rgba(255,255,255,.22);border-radius:5px;padding:0 4px;margin-bottom:1px}
.spl.gut{border-color:rgba(255,255,255,.25)}.spl.mittel{border-color:#f2c94c}.spl.schlecht{border-color:#ff6b5b}.spl.leer{opacity:.6}
.spl.aktiv{background:#fff;color:#14532d;border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.5)}
.spl.aktiv .sz{background:#14532d22}
.bankreihe{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.bankp{font:inherit;font-size:12.5px;background:var(--flaeche2,rgba(127,127,127,.12));color:inherit;border:1.5px solid transparent;border-radius:8px;padding:3px 7px;cursor:pointer}
.bankp.aktiv{border-color:var(--rasen);background:rgba(46,139,87,.18)}
.punkt{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;border:2px solid}.punkt.gut{border-color:#9aa}.punkt.mittel{border-color:#f2c94c}.punkt.schlecht{border-color:#ff6b5b}
/* Dialog */
.schleier{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.dialog{background:var(--karte);width:100%;max-width:560px;max-height:88vh;max-height:88dvh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + var(--unten))}
@media (min-width:821px){ .schleier{align-items:center} .dialog{border-radius:16px;padding:20px} }
.dialog h2{font-size:18px}
.antwort{padding:10px 12px;border-radius:10px;margin:10px 0;background:var(--blau2)}
.antwort.ok{background:var(--gruen2)} .antwort.nein{background:var(--rot2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--unten));background:#1d2b24;color:#fff;padding:10px 16px;border-radius:999px;z-index:60;font-size:14px;max-width:90vw;box-shadow:0 4px 16px rgba(0,0,0,.3)}
@media (min-width:821px){ .toast{bottom:24px} }
.start{max-width:860px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(30px + var(--unten))}
.start h1{font-size:28px;margin-bottom:4px}
.vereinsliste{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.vk{border:1px solid var(--linie);background:var(--karte);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer}
.vk:hover{border-color:var(--gruen)}
.vk b{display:block}
.sterne{color:#e0a800;letter-spacing:1px}
.hinweis{background:var(--gelb2);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.kurve{width:100%;height:140px}
.leer{padding:20px;text-align:center;color:var(--leise)}
.nur-gross{display:table-cell} .nur-klein{display:none}
@media (max-width:620px){ .nur-gross{display:none} .nur-klein{display:inline} th,td{padding:7px 4px} }

.kopf .mehr{background:transparent;border:1px solid rgba(255,255,255,.35);color:var(--kopftext);border-radius:10px;width:40px;height:40px;font-size:18px;flex:none;cursor:pointer}
.kopf .mehr{display:none}
@media (max-width:820px){ .kopf .mehr{display:block} }
/* Speicherplätze */
.platz { padding: 8px 0; border-bottom: 1px solid var(--linie); gap: 8px; }
.platz:last-of-type { border-bottom: 0; }
.platz.gewaehlt b { color: var(--gruen); }
.platz .zeile { flex-wrap: nowrap; }
/* Erfolge */
.trophaee { display: inline-flex; flex-direction: column; align-items: center; width: 92px; margin: 4px; padding: 8px 4px; border-radius: var(--rad); background: var(--bg); text-align: center; font-size: 12px; }
.trophaee .ic { font-size: 30px; line-height: 1.1; }
tr.ich td { font-weight: 600; background: rgba(46, 160, 67, .12); }

/* 1.4: Druck, Halbzeit, Presse, Live-Elf */
.anzeige .druckz{grid-column:1/-1;display:flex;align-items:center;gap:8px;opacity:.9}
.druck{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.druck>i{display:block;height:100%;background:#fff;transition:width .4s}
.halbzeit{border:2px solid var(--gruen)}
.presse{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.presse .knopf{text-align:left;white-space:normal;height:auto;padding:8px 10px}
.elfl td{padding:3px 4px}
/* v1.6: Diagramme, Ligarekorde, Saisonrückblick */
.diagramm{width:100%;height:auto;display:block;overflow:visible}
.diagramm text{font-size:15px;fill:var(--leise);font-family:inherit}
.legende{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px;color:var(--leise)}
.legende i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.marke{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:8px;background:var(--gelb2);color:var(--gelb);white-space:nowrap}
table.lr td:first-child{width:45%}
table.lr td{vertical-align:top}
.rb-kacheln{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.rb-kacheln>div{background:var(--gruen2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;min-width:0}
.rb-kacheln b{font-size:18px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb-liste{margin:4px 0 8px;padding-left:0;list-style:none}
.rb-liste li{padding:5px 0;border-bottom:1px solid var(--linie);font-size:14px}
.rb-mehr{margin:10px 0}
.rb-mehr summary{cursor:pointer;color:var(--gruen);font-weight:600;padding:6px 0}
@media (max-width:420px){ .rb-kacheln b{font-size:16px} .diagramm text{font-size:18px} }
.nebenpos{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px}.nebenpos label{font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:3px}

</style>

// ---------- DFB-Pokal ----------
const POKAL_WOCHEN = [2, 10, 16, 23, 29, 38];
const POKAL_RUNDEN = ['1. Hauptrunde', '2. Hauptrunde', 'Achtelfinale', 'Viertelfinale', 'Halbfinale', 'Finale'];

  if (me && !me.reserve && amaPool.includes(me.id)) { ama.push(me.id); amaPool.splice(amaPool.indexOf(me.id), 1); } // über den Landespokal qualifiziert
  while (ama.length < 24 && amaPool.length) ama.push(amaPool.splice(Math.floor(rnd() * amaPool.length), 1)[0]);
  const t1 = mischen(ama.concat(dl.slice(0, 4), zw.slice(14))), t2 = mischen(bl.concat(zw.slice(0, 14)));
  const spiele = []; while (t1.length && t2.length) { const a = t1.pop(), b = t2.pop(); spiele.push(pokalPaar(a, b, 0)); }
  const rest = mischen(t1.concat(t2)); while (rest.length >= 2) spiele.push(pokalPaar(rest.pop(), rest.pop(), 0));
  S.pokal = { saison: S.saison, runden: [{ name: POKAL_RUNDEN[0], w: POKAL_WOCHEN[0], spiele }], sieger: null };
  const m = spiele.find(x => x.h === S.mein || x.g === S.mein);

function werbungHtml(t) {

    ${frei ? `<button class="knopf p" data-a="werbungalle" style="margin-bottom:10px">Alle freien Flächen zum besten Angebot vergeben (ohne Stadionname)</button>` : ''}

}
function kurve(v) {
  if (!v || v.length < 2) return '<div class="leer klein">Die Kurve erscheint nach den ersten Wochen.</div>';
  const W = 600, H = 140, p = 6; const ys = v.map(x => x[2]); const mn = Math.min(0, ...ys), mx = Math.max(0, ...ys); const sp = mx - mn || 1;
  const X = i => p + i * (W - 2 * p) / (v.length - 1), Y = y => H - p - (y - mn) / sp * (H - 2 * p);
  return `<svg class="kurve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--linie)" stroke-dasharray="4 4"/><polyline fill="none" stroke="var(--gruen)" stroke-width="2.5" vector-effect="non-scaling-stroke" points="${v.map((x, i) => X(i) + ',' + Y(x[2])).join(' ')}"/></svg><div class="zwischen klein leise"><span>${g(mn)}</span><span>${g(mx)}</span></div>`;
}

// Liniendiagramm mit Achsen. reihen: [{p: [[x, y], …], farbe, strich, punkte}], o: {yMin, yMax, invert, yTicks, xTicks, yText, xText, H, baender}
function diagramm(reihen, o) {
  o = o || {}; reihen = reihen.filter(r => r.p && r.p.length);
  if (!reihen.length || reihen.every(r => r.p.length < 2)) return '<div class="leer klein">Das Diagramm erscheint nach den ersten Spielen.</div>';
  const W = 600, H = o.H || 170, pr = 10, pt = 10, pb = 26;
  const xs = reihen.flatMap(r => r.p.map(q => q[0])), ys = reihen.flatMap(r => r.p.map(q => q[1]));
  const x0 = o.xMin != null ? o.xMin : Math.min(...xs), x1 = o.xMax != null ? o.xMax : Math.max(...xs);
  let y0 = o.yMin != null ? o.yMin : Math.min(...ys), y1 = o.yMax != null ? o.yMax : Math.max(...ys); if (y0 === y1) { y0 -= 1; y1 += 1; }
  const yt = o.yTicks || [y0, Math.round((y0 + y1) / 2), y1], xt = o.xTicks || [x0, x1];
  const yf = o.yText || (v => v), xf = o.xText || (v => v);
  const pl = Math.max(34, Math.max(...yt.map(v => String(yf(v)).length)) * 8.4 + 12);
  const X = x => pl + (x - x0) / ((x1 - x0) || 1) * (W - pl - pr);
  const Y = y => o.invert ? pt + (y - y0) / (y1 - y0) * (H - pt - pb) : H - pb - (y - y0) / (y1 - y0) * (H - pt - pb);
  let h = `<svg class="diagramm" viewBox="0 0 ${W} ${H}" role="img">`;
  (o.baender || []).forEach(b => { const a = Y(b[0]), c = Y(b[1]); h += `<rect x="${pl}" width="${W - pl - pr}" y="${Math.min(a, c)}" height="${Math.abs(c - a)}" fill="${b[2]}" opacity=".16"/>`; });
  yt.forEach(v => { h += `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--linie)" stroke-dasharray="3 4"/><text x="${pl - 6}" y="${Y(v) + 5}" text-anchor="end">${e(yf(v))}</text>`; });
  xt.forEach(v => { h += `<text x="${X(v)}" y="${H - 6}" text-anchor="middle">${e(xf(v))}</text>`; });
  reihen.forEach(r => { h += `<polyline fill="none" stroke="${r.farbe || 'var(--gruen)'}" stroke-width="${r.dick || 2.5}" ${r.strich ? 'stroke-dasharray="6 5"' : ''} stroke-linejoin="round" stroke-linecap="round" points="${r.p.map(q => X(q[0]).toFixed(1) + ',' + Y(q[1]).toFixed(1)).join(' ')}"/>`;
    const l = r.p[r.p.length - 1]; if (r.punkte !== false) h += `<circle cx="${X(l[0])}" cy="${Y(l[1])}" r="4.5" fill="${r.farbe || 'var(--gruen)'}"/>`; });
  return h + '</svg>' + (o.legende ? `<div class="legende klein">${o.legende.map(([f, t, st]) => `<span><i style="background:${f}${st ? ';opacity:.6' : ''}"></i>${e(t)}</span>`).join('')}</div>` : '');
}
function platzDiagramm(p, n, li, alt) {
  const baender = [[0.5, 1.5, 'var(--gruen)']]; if (n > 4) baender.push([n - 1.5, n + 0.5, 'var(--rot)']);
  const ticks = [1, Math.ceil(n / 2), n];
  return diagramm([alt ? { p: alt, farbe: 'var(--leise)', strich: true, dick: 1.8, punkte: false } : null, { p }].filter(Boolean), { yMin: 1, yMax: n, invert: true, yTicks: ticks, yText: v => v + '.', xMin: 1, xMax: Math.max(p.length ? p[p.length - 1][0] : 1, FM.rundenAnzahl(li)), xTicks: [1, Math.round(FM.rundenAnzahl(li) / 2), FM.rundenAnzahl(li)], xText: v => v + '. Sp.', baender,
    legende: alt ? [['var(--gruen)', 'diese Saison'], ['var(--leise)', 'Vorsaison', true]] : null });
}

// ---------- Hilfe ----------
function hilfeSeite() {
  return `<h1>Hilfe &amp; Speichern</h1>
  <div class="karte"><h2>Spielstand</h2><p class="klein">Das Spiel speichert automatisch im Speicher dieses Browsers auf diesem Gerät (IndexedDB), zurzeit auf Speicherplatz ${PLATZ}. Zum Sichern oder für ein anderes Gerät: als Datei speichern und dort laden.</p>
  <div class="zeile"><button class="knopf p" data-a="dateispeichern">Spielstand als Datei sichern</button><button class="knopf" data-a="dateiladen">Spielstand aus Datei laden</button><button class="knopf" data-a="csvaktuell">Alle Kader als Tabelle (CSV)</button><button class="knopf" data-nav="editor">🛠️ Spielerdatenbank bearbeiten</button><button class="knopf" data-a="neuesspiel">Speicherplätze &amp; neues Spiel</button></div></div>
  <div class="karte"><h2>So geht's</h2><div class="klein">
  <p><b>Ablauf:</b> Oben rechts auf „Weiter“ tippen, dann läuft eine Woche. Hat dein Verein ein Spiel, kannst du es live verfolgen (mit Wechseln und Taktik) oder sofort berechnen lassen. Eine Saison hat ${FM.WOCHEN} Wochen.</p>
  <p><b>Vorbereitung:</b> Sponsor wählen, Kader verstärken (Transferfenster offen), Ticketpreis und Aufstellung festlegen, dann „Saison starten“.</p>
  <p><b>Aufstellung:</b> Stärke, Fitness und Form zählen. Jeder Spieler hat eine genaue Position (TW Torwart, IV Innenverteidiger, LV/RV Außenverteidiger, DM Sechser, ZM Achter, OM Zehner, LM/RM Außenbahn im Mittelfeld, LA/RA Flügelstürmer, MS Mittelstürmer), bei echten Spielern aus der Wikipedia. Auf dem Spielfeld unter Kader → Aufstellung tippst du zwei Spieler nacheinander an, dann tauschen sie die Plätze, auch mit der Bank. Weißer Rand: gelernte Position. Gelber Rand: verwandte Position, etwas schwächer (z. B. Linksverteidiger rechts). Roter Rand: fremde Position, deutlich schwächer. Beim Formationswechsel bleiben deine elf Spieler auf dem Platz und werden neu verteilt. Verletzte und gesperrte Spieler werden automatisch ersetzt.</p>
  <p><b>Transfers:</b> Erst mit dem Verein über die Ablöse einigen (auch in Raten), dann mit dem Spieler über Gehalt, Laufzeit und Handgeld. Spieler aus höheren Ligen wollen mehr Geld oder gar nicht wechseln.</p>
  <p><b>Finanzen:</b> Gehälter, Stadion, Verwaltung, Nachwuchs und Zinsen laufen jede Woche. Einnahmen: Tickets, TV-Geld (nach Liga und Vorjahresplatz), Sponsor, Fanartikel, Transfers. Mit dem Umsatz wachsen auch die Kosten: Spieltagsbetrieb, Wareneinsatz der Fanartikel, Vermarktung, Verwaltung, Sieg- und Titelprämien für die Spieler (30 % der Pokal- und Europapokal-Prämien) und Beraterhonorare (10 % der Ablöse) – bei großen Vereinen stärker als bei kleinen. Die Gewinn- und Verlustrechnung und die Bilanz zeigen, wie es dem Verein wirklich geht.</p>
  <p><b>Lizenz:</b> In Woche 28 prüft die Liga die Prognose zum Saisonende. Ist sie negativ, gibt es eine Auflage. Ist die Kasse am Saisonende trotzdem im Minus: Zwangsabstieg. Fällt die Kasse unter den Dispo-Rahmen: Insolvenz mit 9 Punkten Abzug.</p>
  <p><b>Vorstand:</b> Er misst dich am Saisonziel und an den Ergebnissen. Sinkt das Vertrauen auf 0, wirst du entlassen und kannst woanders anfangen.</p>
  <p><b>Training & Trainerstab (Kader):</b> Schwerpunkt und Intensität steuern Entwicklung, Frische und Verletzungen. Ein besserer Stab als in der Liga üblich kostet mehr, wirkt aber: Co-Trainer (Entwicklung), Torwarttrainer, Athletiktrainer (Erholung, weniger Verletzungen), Arzt (schnellere Heilung), Scout (genauere Talenteinschätzung, Talentberichte).</p>
  <p><b>DFB-Pokal:</b> 64 Vereine, sechs Runden (Wochen ${FM.POKAL_WOCHEN.join(', ')}). Die tiefere Liga hat Heimrecht, Unentschieden gibt es nicht: Verlängerung und Elfmeterschießen. Jede Runde bringt Prämie und Zuschauereinnahmen. Pokalspiele zählen nicht für Liga-Statistik und Gelbsperren.</p>
  <p><b>Europapokal:</b> Champions League, Europa League und Conference League mit je 36 Vereinen, 2026/27 mit den echten Teilnehmern und der echten Auslosung. Ligaphase (8 bzw. 6 Spieltage), dann Playoffs, Achtelfinale, Viertelfinale, Halbfinale (Hin- und Rückspiel) und Finale an neutralem Ort. Deutsche Vereine qualifizieren sich über die Bundesliga (Platz 1–4 CL, 5 und Pokalsieger EL, 6 ECL). Startgeld und Prämien sind teils sehr hoch, siehe „Spiel“ → „Europapokal“.</p>
  <p><b>Leihen:</b> Im Transferfenster kannst du Ergänzungsspieler und Talente bis 21 Jahre anderer Vereine bis Saisonende ausleihen (Spieler antippen → „Bis Saisonende ausleihen“). Du zahlst eine Leihgebühr und das Gehalt. Eigene Spieler verleihst du über Kader → Spieler → „Verleihen“ in die eigene oder eine tiefere Liga. Der andere Verein zahlt dann das Gehalt, und Spielpraxis lässt Talente wachsen. Zum Saisonende kehren alle Leihspieler zurück (🔁). Beim Ausleihen geht auch eine Kaufoption (teurer, Kauf freiwillig) oder eine Kaufpflicht (billiger, Kauf zum Saisonende sicher).</p>
  <p><b>Sponsoren & Werbeflächen:</b> Den Hauptsponsor wählst du im Büro, alle Angebote kommen von echten Firmen aus deiner Stadt oder deinem Bundesland. Unter Finanzen → Sponsor & Investor vermietest du außerdem Banden, Trikotärmel, Anzeigetafel und weitere Flächen, auf Wunsch alle auf einmal. Auch den Stadionnamen kannst du verkaufen: Das bringt viel Geld, kostet aber Fanstimmung. Läuft der Vertrag aus, heißt das Stadion wieder wie vorher.</p>
  <p><b>Taktik & Rollen:</b> Unter Kader → Aufstellung stellst du neben Formation, Ausrichtung und Einsatz auch Pressing und Spielweise ein, im Spiel kannst du beides live ändern. Es gibt kein „immer richtig“: Konter schlägt offensive Ballbesitz-Teams, verpufft aber gegen Abwehrriegel; hohes Pressing nervt den Gegner, macht aber müde. Dazu bestimmst du Kapitän, Elfmeter- und Standardschützen (Sterne zeigen die Eignung). Nach jedem Spiel erklärt die Spielanalyse mit erwarteten Toren (xG), ob deine Taktik gegriffen hat. Neues Training: Standards.</p>
  <p><b>Jugend & Scouting:</b> Deine U19 findest du unter Kader → Jugend. Jedes Jahr kommen neue Talente (mehr und bessere mit besserem NLZ). Mit 19 musst du sie hochziehen, sonst gehen sie. Unter Transfers → Scouting gibst du deinem Scout einen Auftrag (Liga, Position, Alter). Gefundene Spieler landen auf der Beobachtungsliste. Je öfter beobachtet, desto enger die Talent-Spanne. Jeden Spieler kannst du im Spielerfenster mit „Beobachten“ auf die Liste setzen.</p>
  <p><b>Verhandeln:</b> Jeder Verein hat je Spieler und Transferfenster seine eigene Schmerzgrenze. Spieler in Form, Stammspieler im Winter und Wechsel zu einem Ligakonkurrenten machen es teurer, ein auslaufender Vertrag billiger. Du kannst in Raten zahlen, einen eigenen Spieler dazugeben (Tausch) oder dem Verein eine Weiterverkaufsbeteiligung anbieten. Nach zu vielen schwachen Angeboten brechen Verein oder Spieler die Gespräche ab. Im Vertrag gehen neben Gehalt und Handgeld auch Einsatz-, Tor- und Zielprämien.</p>
  <p><b>Stimmung & Presse:</b> Im Büro siehst du die Stimmung der Fans und der Mannschaft. Siege, vor allem überraschende, heben sie, Niederlagen drücken sie. Gute Fan-Stimmung bringt mehr Zuschauer, mehr Fanartikel und mehr Heimvorteil. Eine gute Mannschaftsstimmung macht dein Team im Spiel etwas stärker. Nach manchen Spielen stellt die Presse eine Frage. Deine Antwort wirkt auf Fans, Mannschaft und Vorstand. Wer nicht antwortet, verärgert den Vorstand ein wenig.</p>
  <p><b>Spieltag:</b> In der Halbzeit hält das Spiel an, und du wählst deine Kabinenansprache. Während des Spiels kannst du das System umstellen, wechseln und Ausrichtung und Einsatz ändern. Der Druckbalken unter dem Spielstand zeigt, wer gerade überlegen ist. „Deine Spieler“ zeigt die Fitness und Gelbe Karten.</p>
  <p><b>Erfolge:</b> Im Menü „Erfolge“ stehen dein Trophäenschrank, deine Trainerbilanz, Rekorde, die Bestenliste deines Vereins, die ewige Bundesliga-Tabelle und alle Titelträger.</p>
  <p><b>Speicherplätze & Schwierigkeit:</b> Es gibt drei Speicherplätze im Browser. „Speicherplätze & neues Spiel“ führt zur Startseite, dein Spiel bleibt dabei gespeichert. Die Schwierigkeit wählst du beim Vereinsstart: Leicht (mehr Geld, geduldiger Vorstand, kleiner Vorteil im Spiel), Normal, Schwer.</p>
  <p><b>Auf- und Abstieg:</b> Bundesliga und 2. Liga: zwei direkt, der Dritte (bzw. 16.) in die Relegation. 3. Liga: zwei direkt hoch, der Dritte in die Relegation, vier steigen in die Regionalliga ihrer Region ab. Regionalligen: Die Meister von West und Südwest steigen direkt auf, von Nord, Nordost und Bayern einer im Wechsel (2026/27 Nordost); die beiden anderen spielen Aufstiegsspiele. Die letzten zwei jeder Regionalliga steigen in die Oberliga ab, von dort rücken Oberliga-Vereine nach (mit erfundenem Kader). Zweite Mannschaften dürfen nicht in die 2. Liga und müssen immer unter ihrer ersten Mannschaft spielen.</p></div></div>
  <div class="karte"><h2>Daten</h2><p class="klein">${e(DATEN.quelle)} Datenstand ${DATEN.stand.split('-').reverse().join('.')}. Wo Wikipedia keinen vollständigen Kader hat, ergänzt das Spiel erfundene Spieler (im Spielerprofil gekennzeichnet). Eigene Daten kannst du beim Start eines neuen Spiels als Tabelle einlesen.</p><p class="klein leise">${STAND}</p></div>`;
}

function weiterKlick() {
  const s = S();
  if (s.gefeuert) return jobs();
  if (offenesSpiel()) { ERG = null; return geh('spiel', 'naechstes'); }
  const r = FM.weiter();
  if (r.typ === 'hinweis') { toast(r.text); return geh('buero'); }
  if (r.typ === 'spiel') { ERG = null; speichern(); return geh('spiel', 'naechstes'); }
  speichern();
  if (r.typ === 'saisonende') { ERG = null; render(); return berichtDialog(r.bericht); }
  if (r.typ === 'woche') { const n = s.post.filter(m => m.neu && m.w === s.woche).length; toast(`Woche ${s.woche} gespielt${n ? ' · ' + n + ' neue Nachricht' + (n > 1 ? 'en' : '') : ''}.`); }
  ERG = null; render();
}
